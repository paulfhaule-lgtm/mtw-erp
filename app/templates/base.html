<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTW ERP</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#18212b}.nav{background:#111827;color:#fff;padding:14px 20px;display:flex;gap:14px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card,form,table{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 10px #0001}.card b{font-size:24px;display:block;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}input,select,button{padding:9px;margin:4px;border:1px solid #ccc;border-radius:6px}button{background:#111827;color:white;cursor:pointer}.ok{color:green}.error{color:#b91c1c}.stage{font-weight:bold}.small{font-size:12px;color:#667085}</style></head><body><div class="nav"><b>MTW ERP</b><a href="/">Dashboard</a><a href="/projects">Projects</a><a href="/documents">Workflow</a><a href="/inventory">Inventory</a><a href="/invoices">Invoices</a><a href="/audit">Audit Trail</a>{% if session.username %}<span style="margin-left:auto">{{session.username}}</span><a href="/logout">Logout</a>{% endif %}</div><div class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<p class="{{c}}">{{m}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
