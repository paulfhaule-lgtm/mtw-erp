{% extends 'base.html' %}{% block content %}<h1>Invoices / Ankara</h1><form method="post"><input name="invoice_no" placeholder="Invoice No. optional"><input name="client" placeholder="Client" required><input name="project" placeholder="Project"><input name="amount" type="number" step="0.01" placeholder="Amount" required><button>Create Invoice</button></form><table><tr><th>Invoice</th><th>Client</th><th>Project</th><th>Amount</th><th>Paid</th><th>Balance</th><th>Status</th></tr>{% for i in invoices %}<tr><td>{{i.invoice_no}}</td><td>{{i.client}}</td><td>{{i.project}}</td><td>{{i.amount}}</td><td>{{i.paid}}</td><td>{{i.amount-i.paid}}</td><td>{{i.status}}</td></tr>{% endfor %}</table>{% endblock %}
