<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTW ERP Login</title><style>body{font-family:Arial;background:#111827;color:white;display:grid;place-items:center;height:100vh}.box{background:white;color:#111;padding:30px;border-radius:14px;width:min(360px,90%)}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}button{background:#111827;color:white;border:0;border-radius:6px}</style></head><body><div class="box"><h1>MTW ERP</h1><p>Metal & Timber Works Co Ltd</p><form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form>{% with messages=get_flashed_messages() %}{% for m in messages %}<p>{{m}}</p>{% endfor %}{% endwith %}</div></body></html>
