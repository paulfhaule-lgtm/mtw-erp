{% extends 'base.html' %}{% block content %}<h1>Inventory / Store</h1><form method="post"><div class="row"><input name="sku" placeholder="SKU (optional)"><input name="item" placeholder="Item / Material" required><input name="unit" placeholder="Unit" value="pcs"><input name="qty" type="number" step="0.01" placeholder="Opening / Add Qty"><input name="reorder" type="number" step="0.01" placeholder="Reorder Level"><button>Save Stock</button></div></form><table><tr><th>SKU</th><th>Item</th><th>Unit</th><th>Qty</th><th>Reorder</th></tr>{% for i in items %}<tr><td>{{i.sku}}</td><td>{{i.item}}</td><td>{{i.unit}}</td><td>{{i.qty}}</td><td>{{i.reorder_level}}</td></tr>{% endfor %}</table>{% endblock %}
