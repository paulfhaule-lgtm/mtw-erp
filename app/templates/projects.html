{% extends 'base.html' %}{% block content %}<h1>Projects / Miradi</h1><form method="post"><div class="row"><input name="code" placeholder="Project Code" required><input name="name" placeholder="Project Name" required><input name="client" placeholder="Client" required><input name="contract_amount" type="number" step="0.01" placeholder="Contract Amount"><button>Create Project</button></div></form>
<table><tr><th>Code</th><th>Project</th><th>Client</th><th>Contract</th><th>Status</th><th>Actions</th></tr>{% for p in projects %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{p.client}}</td><td>TZS {{'%,.2f'|format(p.contract_amount)}}</td><td>{{p.status}}</td><td><a href="/projects/{{p.id}}">Open</a> · <a href="/projects/{{p.id}}/fundis">Fundis & Labour</a></td></tr>{% endfor %}</table>{% endblock %}
