{% extends 'base.html' %}{% block content %}<h1>Edit {{r.request_no}}</h1><form method="post"><div id="items">{% for i in r.items %}<div class="item-row"><input name="item[]" value="{{i.item}}" required><input name="specification[]" value="{{i.specification or ''}}"><input name="quantity[]" type="number" step="0.01" value="{{i.quantity}}"><input name="unit[]" value="{{i.unit}}"><input name="item_reason[]" value="{{i.reason or ''}}"><button type="button" onclick="this.parentElement.remove()">Remove</button></div>{% endfor %}</div><button type="button" onclick="addItem()">+ Add Material</button><textarea name="reason" placeholder="Reason">{{r.reason or ''}}</textarea><button>Save Changes</button></form><script>function addItem(){let d=document.createElement('div');d.className='item-row';d.innerHTML='<input name="item[]" placeholder="Material name" required><input name="specification[]" placeholder="Specification"><input name="quantity[]" type="number" step="0.01" placeholder="Qty"><input name="unit[]" value="pcs"><input name="item_reason[]" placeholder="Reason"><button type="button" onclick="this.parentElement.remove()">Remove</button>';document.getElementById('items').appendChild(d)}</script>{% endblock %}
