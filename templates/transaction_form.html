{% extends 'base.html' %}{% block content %}<h1>Record Income / Expense</h1><form method="post" class="card form"><label>Date</label><input type="date" name="txn_date" value="{{today}}" required><label>Type</label><select name="txn_type"><option>Expense</option><option>Income</option></select><label>Category</label><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select><label>Description</label><input name="description" required><label>Amount (TZS)</label><input type="number" step="0.01" name="amount" required><label>Payment Method</label><select name="payment_method"><option>Cash</option><option>Bank</option><option>Mobile Money</option><option>Cheque</option><option>Other</option></select><label>Project</label><select name="project_id"><option value="">Office / General</option>{% for p in projects %}<option value="{{p.id}}">{{p.code}} - {{p.name}}</option>{% endfor %}</select><label>Reference</label><input name="reference"><label>Notes</label><textarea name="notes"></textarea><button>Save Transaction</button></form>{% endblock %}
