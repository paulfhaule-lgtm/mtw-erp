{% extends "base.html" %}{% block content %}<h1>New Income / Expense</h1><form method="post" class="card form">
<label>Date</label><input type="date" name="txn_date" value="{{today}}" required>
<label>Type</label><select name="txn_type"><option>Expense</option><option>Income</option></select>
<label>Category</label><select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select>
<label>Description</label><input name="description" required placeholder="e.g. Payment from client / purchase of materials">
<label>Amount (TZS)</label><input type="number" step="0.01" min="0.01" name="amount" required>
<label>Payment method</label><select name="payment_method"><option>Cash</option><option>Bank</option><option>Mobile Money</option><option>Cheque</option><option>Other</option></select>
<label>Reference</label><input name="reference" placeholder="Receipt / invoice / payment reference">
<label>Project</label><input name="project" placeholder="Project name (optional)">
<label>Notes</label><textarea name="notes"></textarea><button>Save Transaction</button></form>{% endblock %}
