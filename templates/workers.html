{% extends 'base.html' %}{% block content %}<div class="head"><h1>Fundi & Staff</h1><a class="button" href="{{url_for('worker_new')}}">+ Add Person</a></div><table><tr><th>Name</th><th>Type</th><th>Role</th><th>Phone</th><th>Rate</th><th>Active</th></tr>{% for w in workers %}<tr><td>{{w.name}}</td><td>{{w.worker_type}}</td><td>{{w.role or '-'}}</td><td>{{w.phone or '-'}}</td><td>{{'{:,.2f}'.format(w.agreed_rate or 0)}}</td><td>{{'Yes' if w.active else 'No'}}</td></tr>{% endfor %}</table>{% endblock %}
