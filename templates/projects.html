{% extends 'base.html' %}{% block content %}<div class="head"><h1>Projects / Job Cards</h1><a class="button" href="{{url_for('project_new')}}">+ New Project</a></div><table><tr><th>Code</th><th>Project</th><th>Client</th><th>Contract</th><th>Status</th><th></th></tr>{% for p in projects %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{p.client or '-'}}</td><td>{{'{:,.2f}'.format(p.contract_amount or 0)}}</td><td>{{p.status}}</td><td><a class="button" href="{{url_for('project_detail',pid=p.id)}}">Open Job Card</a></td></tr>{% endfor %}</table>{% endblock %}
