{% extends 'base.html' %}{% block content %}<h1>New Loan / Advance</h1><form method="post" class="card form"><label>Person</label><input name="person" required><label>Type</label><select name="loan_type"><option>Staff Loan</option><option>Fundi Advance</option><option>Project Advance</option></select><label>Project</label><select name="project_id"><option value="">None</option>{% for p in projects %}<option value="{{p.id}}">{{p.code}} - {{p.name}}</option>{% endfor %}</select><label>Date</label><input type="date" name="request_date" value="{{today}}"><label>Amount Requested</label><input type="number" step="0.01" name="amount" required><label>Amount Paid</label><input type="number" step="0.01" name="paid_amount" value="0"><label>Repayment Amount</label><input type="number" step="0.01" name="repayment_amount" value="0"><label>Notes</label><textarea name="notes"></textarea><button>Save Loan</button></form>{% endblock %}
