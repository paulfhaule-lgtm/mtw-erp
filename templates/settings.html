{% extends 'base.html' %}{% block content %}<h1>Company Settings</h1><form method="post" enctype="multipart/form-data" class="card form"><label>Company Name</label><input name="name" value="{{c.name}}" required><label>Address</label><input name="address" value="{{c.address or ''}}"><label>Phone</label><input name="phone" value="{{c.phone or ''}}"><label>Email</label><input name="email" value="{{c.email or ''}}"><label>TIN</label><input name="tin" value="{{c.tin or ''}}"><label>VRN</label><input name="vrn" value="{{c.vrn or ''}}"><label>Invoice Prefix</label><input name="invoice_prefix" value="{{c.invoice_prefix or 'INV'}}"><label>Company Logo</label><input type="file" name="logo" accept="image/*">{% if c.logo %}<img src="{{url_for('static',filename='uploads/'+c.logo)}}" class="logo">{% endif %}<button>Save Company Details</button></form>{% endblock %}
