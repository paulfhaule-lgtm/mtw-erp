{% extends 'base.html' %}{% block content %}<h1>Expense Categories</h1><div class="card"><form method="post" class="inline"><input name="name" placeholder="e.g. Crane Hire, Permit, Accommodation" required><button>Add Category</button></form></div><table><tr><th>Category</th><th>Status</th></tr>{% for c in categories %}<tr><td>{{c.name}}</td><td>{{'Active' if c.active else 'Inactive'}}</td></tr>{% endfor %}</table>{% endblock %}
