{% extends 'base.html' %}{% block content %}<h1>Create Invoice</h1><form method="post" class="card form"><label>Customer</label><input name="customer" required><label>Project</label><select name="project_id"><option value="">None</option>{% for p in projects %}<option value="{{p.id}}">{{p.code}} - {{p.name}}</option>{% endfor %}</select><label>Issue Date</label><input type="date" name="issue_date" value="{{today}}"><label>Due Date</label><input type="date" name="due_date"><label>Tax Rate %</label><input type="number" step="0.01" name="tax_rate" value="0"><h3>Invoice Items</h3><div id="items">{% for n in range(5) %}<div class="row"><input name="description" placeholder="Description"><input type="number" step="0.01" name="quantity" value="1" placeholder="Qty"><input type="number" step="0.01" name="rate" value="0" placeholder="Rate"></div>{% endfor %}</div><label>Notes</label><textarea name="notes"></textarea><button>Create Invoice</button></form>{% endblock %}
