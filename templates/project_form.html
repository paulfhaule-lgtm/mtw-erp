{% extends 'base.html' %}{% block content %}<h1>New Project / Job Card</h1><form method="post" class="card form"><label>Project Code</label><input name="code" placeholder="PRJ-001" required><label>Project Name</label><input name="name" required><label>Client</label><input name="client"><label>Location</label><input name="location"><label>Contract / Invoice Amount (TZS)</label><input type="number" step="0.01" name="contract_amount" value="0"><label>Start Date</label><input type="date" name="start_date" value="{{today}}"><label>Status</label><select name="status"><option>Active</option><option>Completed</option><option>On Hold</option></select><label>Notes</label><textarea name="notes"></textarea><button>Save Project</button></form>{% endblock %}
